# #######################################################################################
# HYPRLAND CONFIGURATION
# Wiki: https://wiki.hypr.land/Configuring/
# #######################################################################################

# ====================================
# MONITORS
# ====================================
# Internal monitor
monitor = eDP-1, 1920x1080@144, 0x0, 1.2
# External monitor (HDMI)
monitor = HDMI-A-2, 1920x1080@60, 1920x0, 1.0, mirror, eDP-1

# ====================================
# XWAYLAND
# ====================================
xwayland {
    force_zero_scaling = true
}

# ====================================
# ENVIRONMENT VARIABLES
# ====================================
# Cursor
# Desktop environment detection untuk xdg-open

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = WLR_NO_HARDWARE_CURSORS,1

env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = XCURSOR_THEME, breeze_cursors
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24

# Theme
env = GTK_THEME, Breeze-Dark
env = GTK_APPLICATION_PREFER_DARK_THEME, 1

# Qt
env = QT_QPA_PLATFORMTHEME, qt5ct
env = QT_STYLE_OVERRIDE, breeze

# Steam scaling
env = STEAM_FORCE_DESKTOPUI_SCALING, 1.5

# === TAMBAHKAN INI ===
# Default applications
env = BROWSER, codium
env = EDITOR, codium
env = VISUAL, codium

# ====================================
# PROGRAM VARIABLES
# ====================================
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$browser = firefox
$noteTaking = obsidian
$code = codium

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = kanshi &
# ====================================
# AUTOSTART
# ====================================
exec-once = waybar &
exec-once = swaybg -i wallpaper.png -m fill
exec-once = systemctl --user start hyprpolkitagent

# GTK/Icon theme settings
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Breeze-Dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'breeze-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'breeze_cursors'

# ====================================
# APPEARANCE
# ====================================
general {
    gaps_in = 2
    gaps_out = 0
    border_size = 1
    
    # Minimalist grayscale borders
    col.active_border = rgba(ffffffcc)      # White 80% opacity
    col.inactive_border = rgba(ffffff33)    # White 20% opacity
    
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    
    active_opacity = 0.98
    inactive_opacity = 0.90
    
    shadow {
        enabled = true
        range = 6
        render_power = 3
        color = rgba(00000066)
    }
    
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.15
    }
}

# ====================================
# ANIMATIONS
# ====================================
animations {
    enabled = yes
    
    # Bezier curves
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    
    # Animation settings
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor, 1, 7, quick
}

# ====================================
# LAYOUTS
# ====================================
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# ====================================
# MISC
# ====================================
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

# ====================================
# INPUT
# ====================================
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    
    touchpad {
        natural_scroll = false
    }
}

# Gestures
gesture = 3, horizontal, workspace

# Per-device configuration
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# ====================================
# KEYBINDINGS
# ====================================
$mainMod = SUPER

# Application launchers
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, N, exec, $noteTaking
bind = $mainMod, C, exec, $code
bind = $mainMod, D, exec, $menu

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
# bind = $mainMod, J, togglesplit

# Focus movement
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# Workspace switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Minimize window
bind = $mainMod, Z, movetoworkspacesilent, special:minimized

# Window switcher
bind = $mainMod, Tab, exec, ~/.config/hypr/wofi-window-switcher.sh

# Window resize
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

# Mouse workspace navigation
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse window management
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshot
bind = , Print, exec, grim ~/Pictures/Screenshot/screenshot-$(date +%Y%m%d-%H%M%S).png

bind = $mainMod, L, exec, swaylock -f -c 000000

# ====================================
# MULTIMEDIA KEYS
# ====================================
# Volume control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness control
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bind = $mainMod, F12, exec, brightnessctl set +5%
bind = $mainMod, F11, exec, brightnessctl set 5%-

# Media control
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ====================================
# WINDOW RULES
# ====================================
# Suppress maximize events
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix XWayland dragging
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Hyprland-run positioning
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}