font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0

background_opacity 0.95
# -1 = konfirmasi menutup HANYA kalau ada program jalan (htop, btop, claude,
# nvim, dll). Kalau cuma prompt shell, tetap tutup langsung. Berlaku juga saat
# ditutup lewat Super+Q (kitty mencegat permintaan close dari compositor).
confirm_os_window_close -1

# skema warna GitHub Dark (non-colorblind)
include github-dark.conf
