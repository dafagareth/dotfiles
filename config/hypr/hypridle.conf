general {
  # hyprlock TIDAK terinstall di sistem ini -> lock_cmd yang lama gagal diam-diam.
  # swaylock dipakai, sama seperti bind Super+L di hyprland.lua.
  # Indikator sengaja dibikin selalu terlihat: layar kunci yang polos hitam
  # gak bisa dibedakan dari layar mati, dan itu bikin panik.
  # Warna & indikator diatur di ~/.config/swaylock/config (satu sumber kebenaran).
  lock_cmd = pidof swaylock || swaylock -f

  before_sleep_cmd = loginctl lock-session

  # Sintaks lama "hyprctl dispatch dpms on" error di Hyprland versi Lua:
  #   error: [string "return hl.dispatch(dpms on)"]:1: ')' expected near 'on'
  #
  # JEBAKAN: hl.dsp.dpms("on") juga SALAH walau balasannya "ok". Lihat
  # Internal::tableToggleAction() -- kalau argumennya bukan tabel, ATAU tabel
  # tanpa field bernama "action", dia balik ke TOGGLE_ACTION_TOGGLE. Jadi
  # dpms("on"), dpms{state="on"}, dpms{on=true} semuanya MEN-TOGGLE, bukan
  # menyalakan. Nama field-nya harus persis "action".
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 10 menit: redupkan layar.
#
# NB: max_brightness panel ini 24000. Config lama menulis "set 10" = raw 10,
# alias 0.04% -> layar hitam pekat sementara keyboard tetap nyala. Itu bug.
# Tanda persen wajib.
listener {
  timeout = 600
  on-timeout = brightnessctl -s set 10%
  on-resume  = brightnessctl -r
}

# 15 menit: kunci layar (layar tetap MENYALA, cuma terkunci).
listener {
  timeout = 900
  on-timeout = loginctl lock-session
}

# SENGAJA TIDAK ADA listener "dpms off".
#
# Layar gak akan pernah dimatikan otomatis. Selain karena kamu memang maunya
# begitu, ada blank screen misterius yang belum ketahuan penyebabnya (sistem
# hidup, musik jalan, tapi output display berhenti) -- jangan tambah satu lagi
# jalur yang bisa mematikan layar sampai itu beres.
#
# Kalau nanti mau hemat baterai, tinggal buka komentar ini.
# Perhatikan field "action" -- tanpa itu perintahnya jadi toggle, dan on-resume
# malah akan MEMATIKAN layar yang barusan nyala.
# listener {
#   timeout = 1200
#   on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
#   on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
# }
#
# Suspend juga sengaja dimatikan:
# listener {
#   timeout = 1800
#   on-timeout = systemctl suspend
# }
