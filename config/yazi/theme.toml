# yazi theme — GitHub Dark (parsial; sisanya ikut preset yazi).
# Catatan: warna named yazi (blue/yellow/dll) sudah memetakan ke palet
# 16-warna kitty yang GitHub Dark, jadi ini cuma mempertegas aksennya.

[mgr]
cwd = { fg = "#58a6ff" }

# baris yang di-hover: sorot biru penuh
hovered = { fg = "#0d1117", bg = "#58a6ff" }

# pencarian (find)
find_keyword  = { fg = "#d29922", bold = true, italic = true }
find_position = { fg = "#bc8cff", bg = "reset", bold = true, italic = true }

# penanda yank/select
marker_copied   = { fg = "#3fb950", bg = "#3fb950" }
marker_cut      = { fg = "#ff7b72", bg = "#ff7b72" }
marker_marked   = { fg = "#39c5cf", bg = "#39c5cf" }
marker_selected = { fg = "#58a6ff", bg = "#58a6ff" }

count_copied   = { fg = "#0d1117", bg = "#3fb950" }
count_cut      = { fg = "#0d1117", bg = "#ff7b72" }
count_selected = { fg = "#0d1117", bg = "#58a6ff" }

border_symbol = "│"
border_style  = { fg = "#30363d" }

[mode]
normal_main = { fg = "#0d1117", bg = "#58a6ff", bold = true }
normal_alt  = { fg = "#58a6ff", bg = "#21262d" }
select_main = { fg = "#0d1117", bg = "#3fb950", bold = true }
select_alt  = { fg = "#3fb950", bg = "#21262d" }
unset_main  = { fg = "#0d1117", bg = "#d29922", bold = true }
unset_alt   = { fg = "#d29922", bg = "#21262d" }

[status]
perm_type  = { fg = "#58a6ff" }
perm_read  = { fg = "#d29922" }
perm_write = { fg = "#ff7b72" }
perm_exec  = { fg = "#3fb950" }
