# cava khusus untuk popup eww -- output RAW (angka), bukan tampilan terminal.
# Terpisah dari ~/.config/cava/config supaya cava biasamu tidak terganggu.

[general]
# jumlah bar menentukan LEBAR visualizer (tiap bar = 1 karakter blok).
# 32 -> pas selebar progress bar. Lebih dari ini, GTK memotong labelnya
# dan muncul "..." di ujung kanan.
bars = 32
framerate = 30
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
# nilai tiap bar 0..7 -> dipetakan ke 8 blok unicode (▁ .. █)
ascii_max_range = 7
# pemisah antar bar = ';'  (59), akhir frame = '\n' (10)
bar_delimiter = 59
frame_delimiter = 10
